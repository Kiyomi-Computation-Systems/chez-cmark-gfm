name: CI

# Linux is the gate for every memory claim (ADR-0003). LeakSanitizer does not
# exist on macOS/ARM64, so a green macOS run was never evidence of no leaks --
# only Valgrind on Linux can support that claim.
#
# THERE IS NO macos JOB, deliberately. GitHub bills macOS runners at 10x the
# Linux rate, and macOS is the primary development platform -- the machine
# every change is written on already runs `make test`, `make check-install`
# and `make test-memory` (ASan) before it is pushed. Paying a 10x multiplier
# to repeat, minutes later, what the author just ran is the least defensible
# spend in this workflow, so it was removed.
#
# What that costs, stated plainly rather than left to be discovered: three
# things now have NO automated gate, and a break in any of them will surface
# on a developer's machine or not at all.
#   1. src/cmark/gfm/private/discovery.sls's macOS branch -- a different
#      candidate list (/opt/homebrew/lib, /usr/local/lib, /opt/local/lib) and
#      a different filename shape (`libcmark-gfm.<version>.dylib`) than the
#      Linux branch below. Neither branch can go red for the other.
#   2. ASan over the suites on arm64.
#   3. docs/installing.md's macOS/ARM64 row, whose Chez version was asserted
#      against the runner. That row now records what the maintainer runs
#      locally; docs/installing.md says so.
# Run `make test check-install test-memory` on macOS before tagging a release.
# Do not "restore coverage" by adding the job back on a schedule -- a nightly
# macOS run costs the same 10x and reports it a day late.
#
# 2.0 has ONE acquisition path, not two: ADR-0001's pkg-config/vendored split
# collapsed into "the system package" the moment the shim was deleted (design
# spec 2026-08-21-shimless-ffi-design.md, 1.3). The jobs below now differ in
# how cmark-gfm was obtained -- apt, or deliberately absent -- which is what
# they actually vary in; HAVE_PKG and a "vendored path" job are gone.
#
# `no-library` and `akku-install` exist for the reason the old vendored job
# was kept as first-class rather than an afterthought: a path nothing ever
# selects is a path whose defects survive to review undetected. The PRE-2.0
# macOS job (a different thing from the one just deleted above) claimed to
# exercise the vendored build while Homebrew's own copy silently satisfied
# discovery first -- green, but for the wrong reason, which is worse than red. Each job below is written to actually fail if the
# thing it claims to prove stops being true.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (apt + valgrind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # First, because it needs nothing: no Chez, no submodules, no apt. The
      # target is awk and grep over the Makefile, so it can run before the
      # toolchain exists and reports a target added without a `## ` line in
      # seconds instead of after a full install. `make help` is what
      # CONTRIBUTING.md and docs/building.md send readers to, and it rots the
      # moment a target arrives undocumented.
      #
      # HERE and nowhere else -- which is now trivially true, since this is
      # the only job that could host it. It was already the rule when a macos
      # job existed, for a reason that outlives it: this reads one file that
      # does not vary by platform, so a second copy would duplicate a result
      # rather than test anything new. Do not add one back to a future job.
      - name: Check every .PHONY target is documented in `make help`
        run: make check-help

      # packaging/debian-prereqs.txt is the single source for the build/test
      # package list (see its header comment). valgrind is added here rather
      # than in that file because it is needed only by this job's memory
      # step below, not to build or use the library.
      #
      # grep, not rg: ripgrep is NOT installed on GitHub-hosted runners. This
      # line used rg once, the substitution collapsed to nothing, apt installed
      # valgrind alone, chezscheme was never present, and every later step
      # failed for reasons pointing nowhere near here. A substitution that
      # fails open is worse than one that errors, so the result is checked.
      - name: Install toolchain
        run: |
          set -eu
          pkgs=$(grep -v -e '^#' -e '^$' packaging/debian-prereqs.txt | tr '\n' ' ')
          if [ -z "$pkgs" ]; then
            echo "::error::packaging/debian-prereqs.txt yielded no packages. That is a broken step, not an empty list -- do not install valgrind alone and cascade."
            exit 1
          fi
          # cmark-gfm now comes from packaging/debian-prereqs.txt like everything
          # else -- it was briefly duplicated on this line while that file still
          # listed the pre-2.0 toolchain. Do not re-add it here: a package named
          # both in the file and in this step is exactly the second copy the
          # file's header rule exists to prevent. valgrind stays here because it
          # is needed only by this job's memory step below, not to build or use
          # the library.
          echo "installing: valgrind $pkgs"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends valgrind $pkgs

      # Recorded rather than asserted: the project's documented Chez floor came
      # from one developer's machine, not from testing. Whatever this prints is
      # what the suite is actually verified against.
      - name: Report versions
        run: |
          echo "chez:     $(chezscheme --version 2>&1 || scheme --version 2>&1)"
          echo "valgrind: $(valgrind --version)"
          echo "cmake:    $(cmake --version | head -1)"
          echo "cc:       $(cc --version | head -1)"
          echo "cmark-gfm CLI (apt): $(cmark-gfm --version | head -1)"

      # The docs/installing.md matrix decays silently the moment a runner
      # image bumps Chez. This makes that a build failure instead.
      # Deliberately asserts agreement with what THIS run used -- it does not
      # pin a version, which would fight the "recorded rather than asserted"
      # note above.
      - name: Check the docs/installing.md matrix names the Chez this job ran
        run: |
          set -eu
          actual=$( (chezscheme --version 2>&1 || scheme --version 2>&1) | tr -d '[:space:]')
          if [ -z "$actual" ]; then
            echo "::error::Could not read a Chez version from this runner (chezscheme --version and scheme --version both produced nothing usable). That is a broken check, not a passing one -- fix version detection instead of letting this step pass silently."
            exit 1
          fi
          echo "this job ran Chez: $actual"
          # Anchored on both ends: the row prefix fixes the left edge, and
          # requiring a space or the column's closing '|' immediately after
          # $actual fixes the right edge, so neither an empty/truncated
          # $actual nor a corrupted table cell with trailing garbage can
          # satisfy this as a substring match would.
          prefix="| Linux/x86-64 (apt)    | $actual"
          # grep, not rg: ripgrep is absent from GitHub-hosted runners. When this
          # used rg, `if ! rg ...` could not tell a missing tool from a real
          # mismatch, so it reported the table as wrong while naming the very
          # version the table already contained -- a false diagnosis sending the
          # reader to edit correct prose.
          command -v grep >/dev/null || { echo "::error::grep is unavailable; this check cannot run."; exit 1; }
          if ! grep -qF -e "$prefix " -e "$prefix|" docs/installing.md; then
            echo "::error::docs/installing.md's Supported matrix does not name Chez $actual for the Linux row."
            echo "This runner now ships a different Chez than the table documents."
            echo "Fix: edit the 'Supported matrix' table in docs/installing.md to say $actual."
            echo "Do not pin the toolchain and do not delete this check -- the table is"
            echo "supposed to track whatever CI actually runs, not the other way around."
            grep -n 'Linux/x86-64' docs/installing.md || true
            exit 1
          fi

      # Ubuntu names the binary `chezscheme`; the Makefile defaults to `chez`.
      - name: Resolve the Chez binary
        run: |
          if command -v chez >/dev/null; then echo "CHEZ=chez" >> "$GITHUB_ENV"
          elif command -v chezscheme >/dev/null; then echo "CHEZ=chezscheme" >> "$GITHUB_ENV"
          elif command -v scheme >/dev/null; then echo "CHEZ=scheme" >> "$GITHUB_ENV"
          else echo "no Chez Scheme binary found" >&2; exit 1; fi

      # The chez-srfi submodule and Akku.lock must name the same commit:
      # consumers install what Akku.lock says, CI tests the submodule. They
      # drifted once already, silently.
      - name: Check dependency pins agree
        run: make check-pins

      - name: Scheme dependencies
        run: make deps

      # vendor/cmark-gfm is a DEV dependency only now: the differential suites'
      # CLI oracle, the 744-example corpus, and the header
      # tests/test-option-bits.sps parses (design spec 1.3, amending
      # ADR-0001). `make deps` above already checked the submodule out --
      # that alone is enough for the corpus and the header -- so nothing in
      # `make test` actually needs this cmake build to have run; $(CMARK_CLI)
      # defaults to the apt-installed `cmark-gfm` on PATH, not a vendor-built
      # binary. This step is kept anyway, as a regression guard:
      # docs/installing.md's RHEL/Fedora/Alpine remedy (8.2) tells those
      # readers to build this exact pinned submodule themselves, and nothing
      # else in CI would notice if that stopped working. cmake and
      # build-essential are installed for this, not for anything of ours --
      # 2.0 compiles no shim on any platform.
      #
      # Cached, with the key doing the work. Nothing about this build varies
      # between two runs that agree on four things: the submodule commit the
      # superproject pins, the Makefile recipe holding the cmake invocation,
      # and the cmake and cc this runner image ships. All four are in the key,
      # so anything that could change the result misses the cache and forces a
      # real build -- the regression guard above can still go red for every
      # reason it could before. A key naming only the path could not say that:
      # a runner-image compiler bump would silently reuse objects built by a
      # compiler no longer installed.
      #
      # Honest about the size of the win: this build is ~6s of cmake on a
      # laptop, so the saving here is seconds, not minutes. It is worth having
      # and it is NOT where this workflow's minutes go -- that is the apt
      # install and the Valgrind step below. Do not read this cache as the
      # reason the bill dropped; removing the 10x macOS job is.
      - name: Vendored cmark-gfm cache key
        id: vendor-cache-key
        run: |
          set -eu
          # The GITLINK -- the commit this superproject pins -- not
          # `git -C vendor/cmark-gfm rev-parse HEAD`, which reports whatever
          # happens to be checked out and would key the cache on a value the
          # repository does not control.
          sha=$(git rev-parse "HEAD:vendor/cmark-gfm")
          tools=$( { cmake --version | head -1; cc --version | head -1; } \
                     | sha256sum | cut -c1-16)
          mk=$(sha256sum Makefile | cut -c1-16)
          echo "key=vendor-cmark-${{ runner.os }}-$sha-$tools-$mk" >> "$GITHUB_OUTPUT"

      # restore/save split rather than actions/cache, so a FAILED build is
      # never saved. actions/cache writes in a post step that runs after the
      # job whatever happened, which would store a half-built tree; the next
      # run would restore it, `cmake --build` would resume from those objects,
      # and a build that genuinely fails from scratch could come out green.
      - name: Restore the vendored cmark-gfm build
        id: vendor-cache
        uses: actions/cache/restore@v4
        with:
          path: build/vendor
          # No restore-keys, deliberately: a partial match is a build tree from
          # a DIFFERENT submodule commit or compiler, which is worse than no
          # cache -- cmake would reuse stale objects and this step would report
          # on something nobody built.
          key: ${{ steps.vendor-cache-key.outputs.key }}

      # Still RUNS on a cache hit. Restoring the tree and skipping the step
      # would turn the regression guard into a check that cannot fail
      # (AGENTS.md); cmake reduces an up-to-date tree to a no-op on its own,
      # which is where the saving comes from, and a restored tree that does not
      # in fact rebuild fails here rather than being taken on trust.
      - name: Build vendored cmark-gfm (dev dependency -- corpus, header, CLI oracle)
        run: make vendor

      # `if:` REPLACES the implicit success() in GitHub Actions rather than
      # adding to it, so success() is spelled out -- without it this saves the
      # tree left behind by a failed `make vendor` above, which is the exact
      # thing the restore/save split exists to prevent.
      - name: Save the vendored cmark-gfm build
        if: success() && steps.vendor-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/vendor
          key: ${{ steps.vendor-cache-key.outputs.key }}

      # This is now THE ONLY build/discovery path -- there is no second one
      # left to distinguish it from, and HAVE_PKG does not exist any more.
      # Finds the apt-installed system libcmark-gfm from the toolchain step
      # above.
      - name: Build (discovery preflight)
        run: make build

      # `make build` above proves a libcmark-gfm resolves from the SOURCE
      # tree. This proves it for an INSTALLED one: `make install` into a temp
      # prefix, then render a document with CHEZSCHEMELIBDIRS naming that
      # prefix alone and CHEZ_CMARK_GFM_LIBS unset. Nothing else in this
      # workflow runs `make install` at all, so without this step the install
      # contract -- the thing docs/installing.md tells every reader to run --
      # is the one path CI never exercises.
      #
      # Covers the LINUX HALF ONLY, and that is a real gap rather than a
      # tidied-up one. src/cmark/gfm/private/discovery.sls hardcodes a
      # different candidate list AND a different filename shape per platform:
      # this job reaches /usr/local/lib, a multiarch triple directory derived
      # at runtime from `machine-type`, /usr/lib and /usr/lib64 for
      # `libcmark-gfm.so.<version>`, while the macOS branch searches
      # /opt/homebrew/lib, /usr/local/lib, /opt/local/lib for
      # `libcmark-gfm.<version>.dylib`. Those are separate branches and this
      # job cannot go red for a break in the other one. The macos job that
      # used to run this same step was deleted for cost (file header); until
      # it returns, `make check-install` on a Mac before a release tag is the
      # only thing that exercises that branch.
      #
      # Placed after "Resolve the Chez binary": CHEZ arrives from the
      # environment that step wrote, which the Makefile's `CHEZ ?= chez`
      # yields to. Before it, this would run `chez`, which Ubuntu does not
      # ship, and fail for a reason it does not claim.
      - name: Check an installed tree imports and renders (apt libcmark-gfm)
        run: make check-install

      # options.sls and ast.sls must import no library that loads a shared
      # object, directly or transitively -- that purity is what makes every
      # assertion in test-options.sps and test-ast.sps unable to pass by
      # accident because of native behaviour. See the Makefile's
      # check-purity target for how.
      - name: Check options.sls and ast.sls stay free of native imports
        run: make check-purity

      - name: Test
        run: make test

      # MOVED HERE from the deleted macos job, which was the only place in CI
      # that ran it. It is not a macOS check: it substantiates the release's
      # headline "no compiler required" claim -- the akku-install job is the
      # other half of that evidence -- and that claim is platform-independent.
      # Deleting the job that happened to host it would have retired the claim's
      # only automated check as a side effect of a billing decision.
      #
      # What is asserted: after this job's `make build`, `make deps` and `make
      # test` above, no compiled object or shared library exists anywhere in the
      # working tree that is ours.
      #
      # It REPLACED a `test ! -e build/lib` guard that could not fail. build/lib
      # was the 1.0 shim's own output directory, and 2.0 deleted the Makefile
      # rules that wrote it -- `build/lib` appears nowhere in the Makefile, so
      # no target can create it and the step passed unconditionally.
      #
      # TWO prunes here where the macos copy had one, and the second is not a
      # weakening -- it is the same exclusion for the same reason, applied to
      # the path this job actually writes. vendor/ is the pinned cmark-gfm
      # submodule; build/vendor is where `make vendor` cmake-builds it, a step
      # the macos job never ran because it installed no cmake. Both hold
      # upstream C, built on purpose as a DEVELOPMENT dependency (the
      # differential suites' CLI oracle, the 744-example corpus, the header
      # tests/test-option-bits.sps parses). Neither is ours. The check still
      # fails on anything of ours that compiles: src/, build/lib, tests/ and
      # everything else stays in the walk.
      #
      # Classified by CONTENT, not by filename: tests/test-library-loading.sps
      # deliberately writes tests/tmp/libcmark-gfm.so and
      # tests/tmp/libcmark-gfm-extensions.so as 20-byte TEXT decoys, to drive
      # discovery's 'load-failed branch. A name-only check trips on those, and
      # the obvious repair -- excluding tests/tmp as well -- would punch a hole
      # in the one writable directory the suite already writes to. file(1)
      # separates a real ELF/Mach-O artifact from a decoy with no second
      # exclusion, and its absence is treated as a broken check rather than a
      # passing one.
      #
      # Before "Memory (valgrind)", which writes no artifact either way, so the
      # walk stays scoped to what this comment says it covers.
      - name: assert no C artifact was produced
        run: |
          set -eu
          command -v file >/dev/null \
            || { echo "::error::file(1) is unavailable; this check cannot run."; exit 1; }
          list="${RUNNER_TEMP:-/tmp}/c-artifact-candidates.txt"
          find . -path ./vendor -prune -o -path ./build/vendor -prune \
                 -o -path ./.git -prune -o -type f \
            \( -name '*.o' -o -name '*.a' -o -name '*.so' -o -name '*.so.*' \
               -o -name '*.dylib' -o -name '*.bundle' \) -print > "$list"
          rc=0
          # read -r, not `for f in $(...)`: a path containing a space must not
          # split into two unexamined halves and pass.
          while IFS= read -r f; do
            desc=$(file -b "$f")
            case "$desc" in
              *Mach-O*|*ELF*|*'ar archive'*)
                echo "::error::compiled artifact present: $f ($desc)"
                rc=1 ;;
              *) echo "  examined, not a binary: $f -- $desc" ;;
            esac
          done < "$list"
          if [ "$rc" -ne 0 ]; then
            echo "2.0 compiles nothing of its own. If something here now builds C, the"
            echo "'no compiler required' claim -- docs/installing.md, and the"
            echo "akku-install job's exit criterion -- is false, and this step is the only"
            echo "place in CI that would notice."
            exit 1
          fi
          echo "no compiled object or shared library outside vendor/ and build/vendor: nothing of ours compiled C"

      # The reason this job exists. Valgrind needs no instrumentation of Chez or
      # cmark and is the only tool in this project that can substantiate a leak
      # claim. Failure here blocks merge.
      - name: Memory (valgrind)
        run: make test-memory

      # `make test` reporting success on a failing suite would silently void
      # every other check in this workflow, so verify the contract itself.
      - name: Verify the test target fails on a failing suite
        run: |
          cat > tests/test-aaci-sabotage.sps <<'EOF'
          #!r6rs
          (import (rnrs) (srfi :64))
          (define runner (test-runner-simple))
          (test-runner-current runner)
          (test-begin "ci-sabotage")
          (test-equal "deliberate failure" 1 2)
          (test-end "ci-sabotage")
          (exit (if (zero? (test-runner-fail-count runner)) 0 1))
          EOF
          if make test > sabotage.log 2>&1; then
            echo "::error::make test exited 0 with a failing suite present"
            rm -f tests/test-aaci-sabotage.sps
            exit 1
          fi
          # A first-position failure must not mask later suites.
          for s in conditions lifecycle native; do
            grep -q "tests/test-$s.sps" sabotage.log \
              || { echo "::error::suite $s did not run after an earlier failure"; exit 1; }
          done
          rm -f tests/test-aaci-sabotage.sps
          echo "test target correctly failed, and no suite was masked"

  clean-install:
    name: clean machine (documented steps only)
    runs-on: ubuntu-latest
    # A bare container, NOT the runner image. ubuntu-latest arrives with a
    # toolchain, git, and build tools already present, so building there
    # proves nothing about a clean machine -- which is exactly what
    # milestone 6's exit criterion is about. This job runs only what
    # docs/installing.md tells a reader to run.
    container: ubuntu:24.04
    steps:
      # A bare container has no git, so checkout cannot run yet. This is the
      # only thing installed that docs/installing.md does not list, and it is
      # needed to obtain the repository at all rather than to build it.
      - name: Bootstrap enough to check out
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The SAME list docs/installing.md points readers at -- one copy, so this
      # cannot drift from the documentation. Must follow checkout, which is
      # what puts the file on disk.
      #
      # That file carries two COMMENT-LABELLED sections (runtime, then the
      # dev packages the vendored oracle needs), and this extraction takes
      # every uncommented line, so the container gets both. The labels are for
      # the reader; splitting them mechanically would mean this job and the
      # linux job reading different files, which is the drift the header rule
      # forbids. The "no compiler required" claim is proved by the
      # akku-install job and by the linux job's assert-no-C-artifact step
      # (which is where that step lives now that macos is gone), not here.
      - name: Install the documented prerequisites
        run: |
          set -eu
          apt-get install -y --no-install-recommends \
            $(grep -v '^#' packaging/debian-prereqs.txt | grep -v '^$' | tr '\n' ' ')

      - name: Report versions
        run: |
          echo "chez: $(chezscheme --version 2>&1)"
          echo "cc:   $(cc --version | head -1)"

      # REMOVED: a step here used to run `chezscheme --script
      # tests/shim-load-probe.sps` with CHEZSCHEMELIBDIRS=src:fallback and
      # assert a genuinely UNBUILT tree raised &cmark-shim-unavailable,
      # reason not-built, rather than Chez's raw library-not-found. Task 4
      # deleted both tests/shim-load-probe.sps and fallback/, and renamed the
      # condition (&cmark-library-unavailable now); more fundamentally, 2.0
      # generates no config.sls and compiles nothing, so "unbuilt" is no
      # longer a distinct state to probe -- importing (cmark gfm) does the
      # same live discovery whether or not `make build` has ever run,
      # anywhere. What this step proved -- that an absent native library is
      # reported with a named remedy, not a raw loader error -- is now the
      # no-library job's entire purpose (reason not-found, current name),
      # and does not need proving a second time here.

      # Historically needed because `make build`'s vendored path ran `git
      # submodule update`, which git refuses on a working tree whose owner
      # differs from the current user -- `fatal: detected dubious
      # ownership`, exit 128 -- and a container job's checkout is made by
      # the runner while its steps run as root. 2.0's `make build` is the
      # discovery preflight and does not touch git at all, so nothing later
      # in this job strictly needs this any more; left in as a cheap,
      # harmless default for whichever future step in this job (or a local
      # reproduction of it) next runs a git command as a different user.
      # Scoped to this throwaway container, never the host.
      - name: Let git operate on the runner-owned checkout
        run: git config --global --add safe.directory '*'

      # CHEZ=chezscheme because Debian names the binary that way and the
      # Makefile defaults to `chez`.
      - name: Build, exactly as docs/installing.md says
        run: make CHEZ=chezscheme build

      # No `make deps`, deliberately. The examples run under
      # CHEZSCHEMELIBDIRS=src alone (Makefile's `examples` target) with no dev
      # dependency whatsoever; omitting deps here is what makes that
      # falsifiable. `fallback/` was deleted in 2.0 and is not on that path.
      - name: Run every documented example
        run: make CHEZ=chezscheme examples

  # A path nothing ever selects is a path whose defects go unreviewed -- the
  # lesson of the old vendored-path job (file header above). Absence of
  # cmark-gfm is exactly such a path: every other job installs it, so nothing
  # would ever exercise the not-found branch of discovery without this job.
  no-library:
    name: no-library (build must name the remedy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install Chez only, deliberately no cmark-gfm
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends chezscheme

      # CHEZ=chezscheme is not optional here: the Makefile defaults to `chez`,
      # which Ubuntu does not ship (see the linux job's "Resolve the Chez
      # binary" step). Without it, `make build` fails at "chez: command not
      # found" -- true, but not the failure this job exists to prove -- and
      # the grep below would then fail for the WRONG reason: exactly the
      # "green/red for reasons unrelated to what the job claims" trap this
      # file's header warns about, just landing on red instead of green.
      # BOTH greps are required, and the reason one is not decoration. The
      # remedy text alone cannot discriminate this failure from any other:
      # tests/preflight.sps's catch-all `else` clause prints the SAME two
      # install one-liners for any condition at all, so a job that greps only
      # for `apt install cmark-gfm` goes green on a raw FFI crash, an
      # unreadable candidate directory, or an out-of-range library just as
      # readily as on the not-found branch it claims to test. Observed exactly
      # that on ubuntu:24.04. The reason symbol is what the not-found clause
      # prints and the catch-all does not, so it is the discriminating half;
      # the remedy grep stays because naming the remedy is the other, separate
      # promise (ADR-0014). Design spec 7.6 asked for this and it was not built.
      - name: build must fail with not-found, and name the remedy
        run: |
          set +e
          out=$(make CHEZ=chezscheme build 2>&1); status=$?
          set -e
          echo "$out"
          test $status -ne 0 || { echo "expected failure, got success" >&2; exit 1; }
          # Matches the clause AND the reason in one string, so a different
          # clause that happened to mention not-found could not satisfy it.
          echo "$out" | grep -q 'no usable libcmark-gfm (not-found)' \
            || { echo "diagnostic did not report reason not-found; this job cannot tell which failure it got" >&2; exit 1; }
          echo "$out" | grep -q 'apt install cmark-gfm' \
            || { echo "diagnostic did not name the remedy" >&2; exit 1; }

  # The exit criterion release 2.0 exists for (design spec 1, 9): install this
  # package with Akku alone, no compiler, and import it with nothing set in
  # the environment.
  akku-install:
    name: akku-install (release 2.0 exit criterion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # chezscheme and cmark-gfm are named here rather than read from
      # packaging/debian-prereqs.txt, deliberately: that file also carries the
      # dev packages (cmake, build-essential) the vendored oracle needs, and
      # installing a compiler on the job whose whole point is "no compiler
      # required" would make it green for a reason it does not claim. This is
      # the runtime half of that file, and nothing else.
      #
      # akku is NOT a Debian/Ubuntu package -- checked directly
      # against packages.ubuntu.com and packages.debian.org, no suite in
      # either carries it -- so it cannot be added to this line; it is
      # installed from its own upstream release in the next step, rather
      # than this job being skipped for lack of an apt package.
      - name: install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends chezscheme cmark-gfm

      # akku 1.1.0's own prebuilt GNU/Linux amd64 release. Runs
      # unconditionally rather than as a fallback after a failed apt attempt
      # -- apt has no package to try, so attempting one first would only
      # waste a step. The URL is GitLab's own upload link for this release
      # (gitlab.com/akkuscm/akku/-/releases/v1.1.0), confirmed reachable and
      # hashed when this step was written; the sha256 pin below is checked
      # against that download, not trusted blind.
      #
      # This exact version has a real, known bug: its libcurl FFI declares
      # the variadic curl_easy_setopt as fixed-arity, which breaks on Apple
      # arm64, where variadic arguments are passed on the stack. This runner
      # is x86-64 Linux, where the fixed-arity and variadic calling
      # conventions agree for the first several arguments, so the bug does
      # not fire here and is deliberately not worked around.
      #
      # Upstream: gitlab.com/akkuscm/akku issue #69, MR !12. The fix (delete
      # the FFI, shell out to curl(1)) is merged to `dev` and unreleased, so
      # 1.1.0 is still the newest tarball. Reproduced locally on arm64 macOS:
      # calling curl_easy_setopt through a fixed-arity function pointer
      # segfaults, while the correct variadic call returns CURLE_OK.
      - name: install akku (no apt package exists; upstream release tarball)
        run: |
          set -eu
          curl -fsSL -o /tmp/akku.tar.xz \
            https://gitlab.com/akkuscm/akku/uploads/094ce726ce3c6cf8c14560f1e31aaea0/akku-1.1.0.amd64-linux.tar.xz
          echo "40efd832c6b517e37060c3c237499749682e6599a6d906f683e5348ea6f998a4  /tmp/akku.tar.xz" | sha256sum -c -
          tar -xf /tmp/akku.tar.xz -C /tmp
          # cd first: install.sh copies with RELATIVE paths (`cp -a lib
          # ~/.local/`), so invoking it by absolute path from another
          # directory fails with `cp: cannot stat 'lib'`. Found on this
          # workflow's first real run.
          cd /tmp/akku-1.1.0.amd64-linux && ./install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The exit criterion itself: install from the manifest, then import
      # with NOTHING set -- no CHEZSCHEMELIBDIRS, no CHEZ_CMARK_GFM_LIBS.
      # `.akku/bin/activate` is what supplies CHEZSCHEMELIBDIRS (pointing at
      # .akku/lib, where Akku places both this package's own sources and its
      # dev dependencies -- Akku.manifest declares no library locations, so
      # this is entirely inferred from the file tree); native discovery then
      # finds the apt-installed libcmark-gfm above on its own, the same
      # search every other job's Build step exercises.
      - name: install from the manifest and import with nothing set
        run: |
          set -eu
          akku install
          # akku install itself succeeded above -- it fetched all four
          # dependencies, installed them and this project, and wrote both
          # .akku/list and .akku/bin/activate. What akku GENERATES, though,
          # reads four variables with no default: $R6RS_PATH and $R7RS_PATH
          # near the top (its first line is `AKKU_CHEZ_PATH="$R6RS_PATH"`),
          # then $LD_LIBRARY_PATH and $DYLD_LIBRARY_PATH further down, for
          # .akku/ffi. That is fine under akku's own assumption that an
          # unset variable expands to empty, but fatal under this step's
          # `set -eu` the moment any one of the four is actually unset --
          # confirmed against the real akku 1.1.0 release tarball in a real
          # ubuntu:24.04 container: guarding only the first two still dies
          # one line later, at "LD_LIBRARY_PATH: unbound variable". This is
          # akku's quirk, not a bug in anything installed above, so all four
          # are accommodated here rather than by dropping set -u for the
          # whole step, which would just as easily hide a real
          # unbound-variable mistake in the exit-criterion command below.
          : "${R6RS_PATH:=}"
          : "${R7RS_PATH:=}"
          : "${LD_LIBRARY_PATH:=}"
          : "${DYLD_LIBRARY_PATH:=}"
          export R6RS_PATH R7RS_PATH LD_LIBRARY_PATH DYLD_LIBRARY_PATH
          . .akku/bin/activate
          # (rnrs) is imported for display alone: chezscheme --program holds
          # a top-level program to strict R6RS import discipline, and
          # (cmark gfm) does not re-export display. Also confirmed against
          # the real ubuntu:24.04 container: without it, this line fails
          # with "unbound identifier display", independently of the set -u
          # accommodation above -- the two are separate latent bugs in this
          # step that both had to clear before the exit criterion could run.
          echo '(import (rnrs) (cmark gfm)) (display (markdown->html "# ok\n" (default-cmark-options)))' > /tmp/t.sps
          chezscheme --program /tmp/t.sps | grep -q '<h1>ok</h1>'
